# State Flow · 国家队 ETF 资金流监测
# 把 root 改成实际路径后：nginx -t && nginx -s reload

server {
    listen 80;
    server_name _;

    root "/absolute/path/to/ETF Monitor";
    index index.html;

    charset utf-8;
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 数据必须 no-cache，避免看板看到旧一天
    location = /index.html { add_header Cache-Control "no-cache, must-revalidate"; }
    location /data/       { add_header Cache-Control "no-cache, must-revalidate"; }
    location ~* \.(?:html|js|css)$ { add_header Cache-Control "no-cache, must-revalidate"; }

    # 静态资源可长缓存（文件名稳定时可改成 7d/30d）
    location ~* \.(?:png|jpg|jpeg|webp|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
